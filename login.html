<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CEMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="brand">
        <div class="brand-name">CEMS</div>
        <div class="brand-sub">College Exam Management System</div>
      </div>
      <h2>Sign in</h2>
      <p class="subtitle">Sign in with your admin or faculty account</p>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Username / Faculty ID</label>
          <input type="text" id="username" class="form-control" placeholder="Enter username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
      </form>
      <div class="text-center mt-3">
        <a href="index.html" class="text-muted" style="font-size:0.875rem;">Back to Home</a>
      </div>
    </div>
  </div>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Ensure database is ready before login
    DB.initPromise.then(function () {
      DB.update(function (data) {
        if (!data.users) data.users = [];
        var hash = DB.hash('admin123');
        var admin = data.users.find(function (u) { return String(u.username).toLowerCase() === 'admin'; });
        if (!admin) {
          data.users.push({ id: DB.nextId(data.users), username: 'admin', password: hash, role: 'admin', name: 'Administrator' });
        } else {
          // Ensure demo admin password always works
          admin.password = hash;
          admin.role = 'admin';
        }
        // Ensure at least one faculty login
        var fac = data.users.find(function (u) { return String(u.username).toUpperCase() === 'FAC001'; });
        if (!fac) {
          data.users.push({ id: DB.nextId(data.users), username: 'FAC001', password: DB.hash('faculty123'), role: 'faculty', faculty_id: 1, name: 'Dr. Ramesh Kumar' });
        }
      });
    });
  </script>
</body>
</html>
